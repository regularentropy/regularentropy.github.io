<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <style>
        body {
            background: #ffffff;
            color: #000000;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 13px;
            line-height: 1.5;
            margin: 0;
            padding: 0;
        }
        #page {
            max-width: 640px;
            margin: 0 auto;
            padding: 60px 15px 30px;
            text-align: center;
        }
        h1 {
            font-family: "Times New Roman", Times, serif;
            font-size: 42px;
            margin: 0 0 10px 0;
        }
        .code {
            font-family: "Courier New", Courier, monospace;
            font-size: 13px;
            background: #000000;
            color: #00ff00;
            padding: 2px 8px;
            letter-spacing: 3px;
            display: inline-block;
        }
        a { color: #0000ee; text-decoration: underline; }
        a:visited { color: #551a8b; }
        .footer {
            margin-top: 40px;
            font-size: 11px;
            color: #666666;
        }
    </style>
</head>
<body>
<div id="page">
    <h1>404</h1>
    <p><b>Page not found.</b></p>
    <p>The page you requested does not exist on this server.<br>
    It may have been moved, deleted, or never existed at all.</p>
    <p><a href="/">&laquo; back to the main page</a></p>
    <p class="footer">
        error: <span class="code">404_NOT_FOUND</span><br>
        best viewed at 1024x768
    </p>
</div>
</body>
</html>
